plugins {
    id 'com.android.application'
}

android {
    namespace 'app.congregacion.elcalafate'
    compileSdk 35

    defaultConfig {
        applicationId 'app.congregacion.elcalafate'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '1.6.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
