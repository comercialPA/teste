name: Build MetaDia V1.1.0 Multi Goal APK

on:
  push:
    branches:
      - build-metadia-v110-multigoal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify MetaDia V1.1.0 source
        shell: bash
        run: |
          cat metadia-v110-full/part_00 metadia-v110-full/part_01 \
            metadia-v110-full/part_02a metadia-v110-full/part_02b metadia-v110-full/part_02c \
            metadia-v110-full/part_02d metadia-v110-full/part_02e metadia-v110-full/part_02f metadia-v110-full/part_02g \
            metadia-v110-full/part_03 metadia-v110-full/part_04 > /tmp/metadia110.b64
          base64 -d /tmp/metadia110.b64 > /tmp/METADIA_V1.1.0_ANDROID.zip
          echo "c56044a0f215abd5f4bb00308ff46202b648df253429da96e778fc2123b72eaf  /tmp/METADIA_V1.1.0_ANDROID.zip" | sha256sum -c -
          unzip -t /tmp/METADIA_V1.1.0_ANDROID.zip
          unzip -q /tmp/METADIA_V1.1.0_ANDROID.zip -d /tmp/metadia110
          echo "6a959e6e6119feaffb37498a548be038a4c5dbc99a57b778c5528a486955a958  /tmp/metadia110/METADIA_V1.1.0/app/src/main/assets/index.html" | sha256sum -c -
          grep -q "metadia_state_v2" /tmp/metadia110/METADIA_V1.1.0/app/src/main/assets/index.html
          grep -q "EUR" /tmp/metadia110/METADIA_V1.1.0/app/src/main/assets/index.html
          grep -q "versionCode 4" /tmp/metadia110/METADIA_V1.1.0/app/build.gradle
          grep -q "versionName '1.1.0'" /tmp/metadia110/METADIA_V1.1.0/app/build.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: /tmp/metadia110/METADIA_V1.1.0
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp /tmp/metadia110/METADIA_V1.1.0/app/build/outputs/apk/debug/app-debug.apk /tmp/MetaDia_V1.1.0.apk
          unzip -t /tmp/MetaDia_V1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaDia_V1.1.0_APK
          path: /tmp/MetaDia_V1.1.0.apk
          if-no-files-found: error
