name: Build MetaDia V1.0.2 Format APK

on:
  push:
    branches:
      - build-metadia-v102-format
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify source
        shell: bash
        run: |
          cat metadia-format/part_00 metadia-format/part_01 metadia-format/part_02 metadia-format/part_03 metadia-format/part_04 > /tmp/metadia102.b64
          echo "bd818685b4c34a5b68202cc60ac3c01239e66741e1080b765be4b421af8bb47f  /tmp/metadia102.b64" | sha256sum -c -
          base64 -d /tmp/metadia102.b64 > /tmp/metadia102.zip
          echo "000ffb74e1f9557bb51c6a6ea9d48b18ecfc43995fb29671a757654868bd988d  /tmp/metadia102.zip" | sha256sum -c -
          unzip -q /tmp/metadia102.zip -d /tmp/metadia102

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: /tmp/metadia102/METADIA_V1.0.2
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: cp /tmp/metadia102/METADIA_V1.0.2/app/build/outputs/apk/debug/app-debug.apk /tmp/MetaDia_V1.0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaDia_V1.0.2_APK
          path: /tmp/MetaDia_V1.0.2.apk
          if-no-files-found: error
