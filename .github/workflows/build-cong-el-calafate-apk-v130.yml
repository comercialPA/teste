name: Build Cong El Calafate APK v1.3.0

on:
  push:
    branches:
      - build/cong-el-calafate-v1.3.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools"

      - name: Assemble embedded V1.3.0 assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS='cong_el_calafate_android/app/src/main/assets'
          mkdir -p "$ASSETS/icons" cong_el_calafate_android/app/src/main/res/drawable
          cat .github/v130-app/app.part.00 .github/v130-app/app.part.01 .github/v130-app/app.part.02 .github/v130-app/app.part.03 > "$ASSETS/app.js"
          curl -fsSL --retry 3 'https://cong-el-calafate-app.vercel.app/icons/icon-192.png' -o "$ASSETS/icons/icon-192.png"
          curl -fsSL --retry 3 'https://cong-el-calafate-app.vercel.app/icons/icon-512.png' -o "$ASSETS/icons/icon-512.png"
          cp "$ASSETS/icons/icon-512.png" cong_el_calafate_android/app/src/main/res/drawable/ic_launcher.png

      - name: Verify V1.3.0 app integrity
        shell: bash
        run: |
          set -euo pipefail
          ASSETS='cong_el_calafate_android/app/src/main/assets'
          test "$(sha256sum "$ASSETS/index.html" | awk '{print $1}')" = 'e5e0705a3cbfcbcd3baa645e4e4e0fe6ae11c3973de9a6a621ebda2915391431'
          test "$(sha256sum "$ASSETS/styles.css" | awk '{print $1}')" = '622c3904dcf397d411402f0c8f9b75e22c0d95e94a7ff8e9da24d1254b8676ed'
          test "$(sha256sum "$ASSETS/app.js" | awk '{print $1}')" = 'fafaabd55b7b3f18ebb15fff7647d7a0252148d42424346625819f732b47c5e2'
          test "$(sha256sum cong_el_calafate_android/app/src/main/java/app/congregacion/elcalafate/MainActivity.java | awk '{print $1}')" = '5ff8e61b65af1cfff95465db7d3448ebe67c39cacabfed9dc5a4db588cb03a58'
          test "$(sha256sum cong_el_calafate_android/app/build.gradle | awk '{print $1}')" = '94f47b7acf51e48d51843dc49dee92f698c364e9abf1f835ee7f7b6187d94904'
          node --check "$ASSETS/app.js"
          test "$(grep -o "sheetId:'" "$ASSETS/app.js" | wc -l | tr -d ' ')" = '9'
          grep -q 'Array.from({length:102}' "$ASSETS/app.js"
          grep -q 'loadElCalafateStreets' "$ASSETS/app.js"
          grep -q 'window.AndroidBridge.*loadSheet' "$ASSETS/app.js"
          grep -q 'Aplicación v1.3.0' "$ASSETS/index.html"
          grep -q 'versionCode 13' cong_el_calafate_android/app/build.gradle
          grep -q "versionName '1.3.0'" cong_el_calafate_android/app/build.gradle

      - name: Verify permissions and navigation policy
        shell: bash
        run: |
          set -euo pipefail
          MAN='cong_el_calafate_android/app/src/main/AndroidManifest.xml'
          JAVA='cong_el_calafate_android/app/src/main/java/app/congregacion/elcalafate/MainActivity.java'
          test "$(grep -c '<uses-permission' "$MAN")" = '1'
          grep -q 'android.permission.INTERNET' "$MAN"
          ! grep -E 'CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|POST_NOTIFICATIONS|RECORD_AUDIO' "$MAN"
          grep -q 'addJavascriptInterface(new AppBridge(), "AndroidBridge")' "$JAVA"
          test "$(grep -c '^[[:space:]]*"1.*"' "$JAVA")" -ge 9
          ! grep -q 'Intent.ACTION_VIEW' "$JAVA"
          ! grep -q 'openExternal' "$JAVA"

      - name: Build installable APK
        shell: bash
        run: gradle -p cong_el_calafate_android --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK payload and hash
        shell: bash
        run: |
          set -euo pipefail
          APK='cong_el_calafate_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/app.js > /tmp/apk-app.js
          test "$(sha256sum /tmp/apk-app.js | awk '{print $1}')" = 'fafaabd55b7b3f18ebb15fff7647d7a0252148d42424346625819f732b47c5e2'
          grep -q 'loadElCalafateStreets' /tmp/apk-app.js
          test "$(grep -o "sheetId:'" /tmp/apk-app.js | wc -l | tr -d ' ')" = '9'
          cp "$APK" CONG_EL_CALAFATE_V1.3.0.apk
          sha256sum CONG_EL_CALAFATE_V1.3.0.apk | tee APK_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CONG_EL_CALAFATE_V1.3.0_APK
          path: |
            CONG_EL_CALAFATE_V1.3.0.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
