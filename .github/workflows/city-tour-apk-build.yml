name: Build City Tour APK

on:
  push:
    branches: [city-tour-apk-v1]
    paths:
      - 'city-tour-offline/**'
      - '.github/workflows/city-tour-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned release APK
        working-directory: city-tour-offline
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp city-tour-offline/app/build/outputs/apk/release/app-release-unsigned.apk artifact/CITY_TOUR_OFFLINE_V1.0.1_PERLA_ANDINA_UNSIGNED.apk
          BT_DIR=$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$BT_DIR/lib/apksigner.jar" artifact/apksigner.jar
          cp "$BT_DIR/zipalign" artifact/zipalign

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: CITY_TOUR_OFFLINE_V1.0.1_PERLA_ANDINA_BUILD
          path: artifact/
          if-no-files-found: error
          retention-days: 1
