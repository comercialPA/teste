name: Build MetaDia APK

on:
  push:
    branches:
      - build-metadia-apk-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat metadia-build/part_00 metadia-build/part_01 metadia-build/part_02 metadia-build/part_03 metadia-build/part_04 > /tmp/metadia.b64
          base64 -d /tmp/metadia.b64 > /tmp/metadia.zip
          unzip -q /tmp/metadia.zip -d /tmp/metadia

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: /tmp/metadia/METADIA_V1.0.1
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: cp /tmp/metadia/METADIA_V1.0.1/app/build/outputs/apk/debug/app-debug.apk /tmp/MetaDia_V1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaDia_V1.0.1_APK
          path: /tmp/MetaDia_V1.0.1.apk
          if-no-files-found: error
