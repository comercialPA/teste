name: Build MetaDia V1.0.2 unsigned APK

on:
  push:
    branches:
      - build-metadia-apk-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild MetaDia V1.0.2 source
        shell: bash
        run: |
          cat metadia-v102/part_00 metadia-v102/part_01 > /tmp/metadia102.b64
          base64 -d /tmp/metadia102.b64 > /tmp/metadia102.zip
          unzip -q /tmp/metadia102.zip -d /tmp/metadia102

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: /tmp/metadia102/METADIA_V1.0.2
        run: gradle assembleRelease --stacktrace

      - name: Align unsigned APK
        shell: bash
        run: |
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -f 4 \
            /tmp/metadia102/METADIA_V1.0.2/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/MetaDia_V1.0.2-unsigned-aligned.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 /tmp/MetaDia_V1.0.2-unsigned-aligned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaDia_V1.0.2_UNSIGNED
          path: /tmp/MetaDia_V1.0.2-unsigned-aligned.apk
          if-no-files-found: error
